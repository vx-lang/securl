# Checks that need no Vx compiler. The build and the tests need a vxc built from Vx main, which
# this workflow does not have yet.
name: checks
on:
  push:
  pull_request:
jobs:
  no-pointers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No raw pointers in the code with no trusted code
        run: tools/check-no-pointers.sh
