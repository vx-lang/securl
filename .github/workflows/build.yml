# Build securl with vxc from a pinned commit of Vx main, and run its tests.
#
# Each job installs LLVM 22, MLIR and z3 from apt.llvm.org with Vx's own setup_linux.sh. vxc
# builds from the commit in VX_COMMIT once, and the cache keeps it in ~/vx, with its runtime
# library and the stdlib that it reads beside it.
name: build
on:
  push:
  pull_request:
env:
  VX_COMMIT: 98e8df6d5f85340e1c71ec8593384c3132b7b749
  CURL_COMMIT: 2f5c65743b4af7f8cc0bd0305740237bd054774c
jobs:
  vxc:
    runs-on: ubuntu-24.04
    steps:
      - name: Cache vxc
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/vx
          key: vxc-${{ env.VX_COMMIT }}
      - name: Get Vx
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/vx-lang/Vx ~/vx
          git -C ~/vx checkout --detach "$VX_COMMIT"
      - name: LLVM 22, MLIR and z3
        if: steps.cache.outputs.cache-hit != 'true'
        run: ~/vx/scripts/provision/setup_linux.sh
      - name: Build vxc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd ~/vx
          ./setup.sh
          . ./config.local
          cargo build --release
          mkdir -p dist
          cp target/release/vxc target/release/libvx_std_core.a target/release/libvx_std_core.so dist/
          # Only dist/ and the stdlib that vxc reads from dist/../stdlib go in the cache.
          rm -rf target

  test:
    needs: vxc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Restore vxc
        uses: actions/cache/restore@v4
        with:
          path: ~/vx
          key: vxc-${{ env.VX_COMMIT }}
          fail-on-cache-miss: true
      - name: LLVM 22 for vxc, and the runtime of libFuzzer
        run: |
          ~/vx/scripts/provision/setup_linux.sh
          sudo apt-get install -y -qq libclang-rt-22-dev
      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: build/openssl
          key: openssl-${{ hashFiles('.git/modules/third_party/openssl/HEAD', 'Makefile') }}
      - name: Settings
        run: |
          echo "VXC = $HOME/vx/dist/vxc" > config.mk
          echo "VX_LIBDIR = $HOME/vx/dist" >> config.mk
          echo "JOBS = 4" >> config.mk
      - name: Build
        run: make
      - name: Audit
        run: make audit
      - name: Unit tests
        run: make unit
      - name: TLS tests
        run: make test-tls
      - name: HTTP/2 tests
        run: make test-h2
      - name: Fuzz each parser for 30 seconds
        run: make fuzz FUZZ_TIME=30
      - name: Keep the inputs of a crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crash-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: securl
          path: build/securl

  curl-tests:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # securl links the runtime of vxc, libvx_std_core, from ~/vx/dist.
      - name: Restore vxc
        uses: actions/cache/restore@v4
        with:
          path: ~/vx
          key: vxc-${{ env.VX_COMMIT }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: securl
          path: build
      # `make openssl-dev` builds OpenSSL here: OpenSSL's Makefile takes a restored build as
      # older than the fresh checkout of its sources, and configures it again, which fails.
      - name: Build curl's test servers, stunnel and nghttpx
        run: |
          chmod +x build/securl
          make openssl-dev
          git clone --filter=blob:none https://github.com/curl/curl ~/curl-src
          git -C ~/curl-src checkout --detach "$CURL_COMMIT"
          cmake -S ~/curl-src -B ~/curl-src/build -DCURL_ENABLE_SSL=ON -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_ROOT_DIR="$PWD/build/openssl-dev/usr/local" \
            -DCURL_USE_LIBPSL=OFF -DUSE_LIBIDN2=OFF -DCURL_ZLIB=OFF -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF -DUSE_NGHTTP2=OFF -DCURL_USE_LIBSSH2=OFF -DCURL_DISABLE_LDAP=ON \
            -DBUILD_TESTING=ON
          cmake --build ~/curl-src/build -j4
          cmake --build ~/curl-src/build --target testdeps -j4
          JOBS=4 tools/build-test-tools.sh
      - name: The supported curl tests
        run: tests/check-supported.sh ~/curl-src
