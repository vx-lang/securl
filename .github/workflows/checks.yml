# Checks that need no Vx compiler, which run in seconds. build.yml builds securl and runs its
# tests.
name: checks
on:
  push:
  pull_request:
jobs:
  no-pointers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No raw pointers in the code with no trusted code
        run: tools/check-no-pointers.sh
      - name: Only auth.vx sends a password
        run: tools/check-secrets.sh
