# Build securl with vxc from a pinned commit of Vx main, and run its tests.
#
# The jobs run in Vx's build image, which has LLVM 22 with MLIR, clang and Rust. vxc builds from
# the commit in VX_COMMIT, once: the cache keeps it, with its runtime library and the stdlib that
# it reads beside it.
name: build
on:
  push:
  pull_request:
env:
  VX_COMMIT: 98e8df6d5f85340e1c71ec8593384c3132b7b749
  CURL_COMMIT: 2f5c65743b4af7f8cc0bd0305740237bd054774c
jobs:
  vxc:
    runs-on: ubuntu-24.04
    container: ghcr.io/vx-lang/vx-build:llvm22
    steps:
      - name: Cache vxc
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/vx
          key: vxc-${{ env.VX_COMMIT }}
      - name: Build vxc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/vx-lang/Vx /opt/vx
          cd /opt/vx
          git checkout --detach "$VX_COMMIT"
          cargo build --release
          mkdir -p dist
          cp target/release/vxc target/release/libvx_std_core.a target/release/libvx_std_core.so dist/
          # Only dist/ and the stdlib that vxc reads from dist/../stdlib go in the cache.
          rm -rf target

  test:
    needs: vxc
    runs-on: ubuntu-24.04
    container: ghcr.io/vx-lang/vx-build:llvm22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Restore vxc
        uses: actions/cache/restore@v4
        with:
          path: /opt/vx
          key: vxc-${{ env.VX_COMMIT }}
          fail-on-cache-miss: true
      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: build/openssl
          key: openssl-${{ hashFiles('.git/modules/third_party/openssl/HEAD', 'Makefile') }}
      - name: Settings
        run: |
          echo "VXC = /opt/vx/dist/vxc" > config.mk
          echo "VX_LIBDIR = /opt/vx/dist" >> config.mk
          echo "JOBS = 4" >> config.mk
      - name: Python
        run: apt-get update -qq && apt-get install -y -qq python3 python3-venv
      - name: Build
        run: make
      - name: Audit
        run: make audit
      - name: Unit tests
        run: make unit
      - name: TLS tests
        run: make test-tls
      - name: HTTP/2 tests
        run: make test-h2
      - name: Fuzz each parser for 30 seconds
        run: make fuzz FUZZ_TIME=30
      - name: Keep the inputs of a crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crash-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: securl
          path: build/securl

  curl-tests:
    needs: test
    runs-on: ubuntu-24.04
    container: ghcr.io/vx-lang/vx-build:llvm22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # securl links the runtime of vxc, libvx_std_core, from /opt/vx/dist.
      - name: Restore vxc
        uses: actions/cache/restore@v4
        with:
          path: /opt/vx
          key: vxc-${{ env.VX_COMMIT }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: securl
          path: build
      - name: Restore OpenSSL
        uses: actions/cache/restore@v4
        with:
          path: build/openssl
          key: openssl-${{ hashFiles('.git/modules/third_party/openssl/HEAD', 'Makefile') }}
      - name: Perl and Python
        run: apt-get update -qq && apt-get install -y -qq perl python3 python3-venv
      - name: Build curl's test servers, stunnel and nghttpx
        run: |
          chmod +x build/securl
          make openssl-dev
          git clone --filter=blob:none https://github.com/curl/curl /opt/curl-src
          git -C /opt/curl-src checkout --detach "$CURL_COMMIT"
          cmake -S /opt/curl-src -B /opt/curl-src/build -DCURL_ENABLE_SSL=ON -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_ROOT_DIR="$PWD/build/openssl-dev/usr/local" \
            -DCURL_USE_LIBPSL=OFF -DUSE_LIBIDN2=OFF -DCURL_ZLIB=OFF -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF -DUSE_NGHTTP2=OFF -DCURL_USE_LIBSSH2=OFF -DCURL_DISABLE_LDAP=ON \
            -DBUILD_TESTING=ON
          cmake --build /opt/curl-src/build -j4
          cmake --build /opt/curl-src/build --target testdeps -j4
          JOBS=4 tools/build-test-tools.sh
      - name: The supported curl tests
        run: tests/check-supported.sh /opt/curl-src
